# Adapted from https://zensical.org/docs/publish-your-site/#with-github-actions
#
# Also builds the WebAssembly version of GaborFilter,
# which is used by the 'Run' page of the website.
name: Create Zensical website

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/create_zensical_website.yaml
      - 'docs/**'
      - zensical.toml
      - 'wasm/**'
      - gaborfilter.cpp
      - gaborfilter.h
      - scripts/build_wasm.sh

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - uses: mymindstorm/setup-emsdk@v14
      - name: Build WebAssembly version
        run: ./scripts/build_wasm.sh
      - run: pip install zensical
      - run: zensical build --clean --strict
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
